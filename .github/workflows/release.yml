name: Release Mod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # === 1. 自动从 C# 代码提取配置 ===
      - name: Auto-detect Configuration from C#
        id: auto_config
        run: |
          # 1. 查找 VersionInfo.cs 文件
          # 我们假设它在某个 Core 目录下，或者直接全库搜索
          CS_FILE=$(find . -name "VersionInfo.cs" -print -quit)
          
          if [ -z "$CS_FILE" ]; then
            echo "Error: Could not find 'VersionInfo.cs' in the repository."
            exit 1
          fi
          echo "Found VersionInfo at: $CS_FILE"

          # 2. 使用正则从 C# 代码中提取 Name 和 Version
          # 匹配: public const string Name = "提取这里";
          # sed -E 's/.*Name\s*=\s*"(.*)";.*/\1/' 是核心正则逻辑
          
          RAW_NAME=$(grep 'public const string Name' "$CS_FILE" | sed -E 's/.*Name\s*=\s*"(.*)";.*/\1/')
          # 去除可能存在的首尾空格 (xargs)
          MOD_NAME=$(echo "$RAW_NAME" | xargs)
          
          RAW_VERSION=$(grep 'public const string Version' "$CS_FILE" | sed -E 's/.*Version\s*=\s*"(.*)";.*/\1/')
          MOD_VERSION=$(echo "$RAW_VERSION" | xargs)

          echo "Extracted Name: [$MOD_NAME]"
          echo "Extracted Version: [$MOD_VERSION]"

          # 3. 自动定位 MOD 文件夹路径
          # 逻辑：在当前目录下（或深入一级）寻找与 MOD_NAME 同名的文件夹
          TARGET_DIR=$(find . -maxdepth 2 -type d -name "$MOD_NAME" -not -path '*/.*' -print -quit)

          if [ -z "$TARGET_DIR" ]; then
            echo "Error: Folder named '$MOD_NAME' not found!"
            echo "Please ensure the folder name matches the 'Name' constant in VersionInfo.cs"
            exit 1
          fi

          echo "Found Mod Folder: $TARGET_DIR"

          # 4. 导出环境变量供后续步骤使用
          echo "MOD_PATH=$TARGET_DIR" >> $GITHUB_ENV
          echo "VERSION=$MOD_VERSION" >> $GITHUB_ENV
          
          # 设置压缩包名称: Name_Version.zip
          echo "ZIP_FILENAME=${MOD_NAME}_${MOD_VERSION}.zip" >> $GITHUB_ENV

      # === 提取 CHANGELOG.md 内容与标题 ===
      - name: Extract Changelog and Title
        id: changelog_reader
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = process.env.VERSION;
            
            const changelogPath = './CHANGELOG.md';
            
            // 默认兜底标题 (如果没找到文件)
            let releaseTitle = `[${version}]`; 
            let notes = '';

            if (fs.existsSync(changelogPath)) {
              const content = fs.readFileSync(changelogPath, 'utf8');
              const lines = content.split('\n');
              
              let extract = [];
              let isRecording = false;

              // 匹配: ## [1.8.3] ...
              const escapedVersion = version.replace(/\./g, '\\.');
              const targetHeaderRegex = new RegExp(`^##\\s+\\[${escapedVersion}\\]`);
              const anyHeaderRegex = /^##\s+\[/;

              for (const line of lines) {
                // 1. 遇到下一个版本标题 -> 停止
                if (isRecording && anyHeaderRegex.test(line)) {
                  break;
                }
                
                // 2. 正在录制 -> 存入内容
                if (isRecording) {
                  extract.push(line);
                }
                
                // 3. 找到目标版本 -> 开始录制并提取标题
                if (!isRecording && targetHeaderRegex.test(line)) {
                  isRecording = true;
                  // 去掉行首的 "## "，保留 "[1.8.3] - 2025-12-19"
                  releaseTitle = line.replace(/^##\s+/, '').trim();
                }
              }
              
              notes = extract.join('\n').trim();
            }

            // 如果没找到对应的日志，给个默认提示
            if (!notes) {
                console.log('Log not found for ' + version);
                notes = `Release v${version}`;
                // 如果没找到日志，标题也只能用默认的
                if (releaseTitle === `[${version}]`) releaseTitle = `v${version}`;
            }

            console.log(`Extracted Title: ${releaseTitle}`);
            
            // 输出两个变量: title 和 notes
            core.setOutput('title', releaseTitle);
            core.setOutput('notes', notes);
        env:
          VERSION: ${{ env.VERSION }}

      # === 压缩文件夹 ===
      - name: Zip Mod Folder
        run: |
          parent_dir=$(dirname "${{ env.MOD_PATH }}")
          folder_name=$(basename "${{ env.MOD_PATH }}")
          
          cd "$parent_dir"
          zip -r "${{ github.workspace }}/${{ env.ZIP_FILENAME }}" "$folder_name" -x "*.git*" "*.vscode*" "*/bin/*" "*/obj/*"

      # === 发布 ===
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ZIP_FILENAME }}
          
          # 使用提取出来的标题
          # 结果示例: "[1.8.3] - 2025-12-19"
          name: ${{ steps.changelog_reader.outputs.title }}
          
          body: ${{ steps.changelog_reader.outputs.notes }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}